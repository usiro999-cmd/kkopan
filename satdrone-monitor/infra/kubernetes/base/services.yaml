apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: satdrone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/satdrone-monitor/api-gateway:0.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: satdrone-config
            - secretRef:
                name: satdrone-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: satdrone
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http

