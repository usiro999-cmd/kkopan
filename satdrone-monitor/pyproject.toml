[project]
name = "satdrone-monitor"
version = "0.1.0"
description = "Satellite anomaly detection and autonomous drone monitoring platform"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pika>=1.3,<2",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<6",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]
ai = [
  "opencv-python-headless>=4.10,<5",
  "torch>=2.5,<3",
  "ultralytics>=8.3,<9",
]
drone = [
  "mavsdk>=2.8,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services/common"]

[tool.pytest.ini_options]
pythonpath = ["services/common", "services"]
testpaths = ["services"]
asyncio_mode = "auto"
