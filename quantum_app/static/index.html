<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Circuit Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">PYTHON QUANTUM SIMULATOR</p>
      <h1>Quantum Circuit Lab</h1>
      <p>量子ゲートを並べて、状態ベクトルと測定結果をリアルタイムに観察しよう。</p>
    </header>

    <section class="workspace">
      <aside class="panel controls">
        <label>量子ビット数
          <select id="qubit-count">
            <option>1</option><option>2</option><option selected>3</option>
            <option>4</option><option>5</option><option>6</option>
          </select>
        </label>
        <div>
          <span class="label">ゲート</span>
          <div id="gate-palette" class="gate-palette"></div>
        </div>
        <label>対象 qubit
          <select id="target-qubit"></select>
        </label>
        <label id="control-field">制御 qubit
          <select id="control-qubit"></select>
        </label>
        <label id="angle-field">RY 角度
          <input id="angle" type="range" min="-3.142" max="3.142" step="0.01" value="1.57">
          <output id="angle-output">1.57 rad</output>
        </label>
        <button id="add-gate" class="primary">ゲートを追加</button>
        <button id="bell-state">Bell状態を作る</button>
        <button id="clear">回路をクリア</button>
      </aside>

      <section class="panel circuit-panel">
        <div class="section-heading">
          <div><span class="step">01</span><h2>量子回路</h2></div>
          <span id="gate-count">0 gates</span>
        </div>
        <div id="circuit" class="circuit"></div>
        <p id="error" role="alert"></p>
      </section>
    </section>

    <section class="results">
      <article class="panel">
        <div class="section-heading"><div><span class="step">02</span><h2>状態確率</h2></div></div>
        <div id="probabilities" class="probabilities"></div>
      </article>
      <article class="panel">
        <div class="section-heading"><div><span class="step">03</span><h2>測定 (1024 shots)</h2></div></div>
        <div id="measurements" class="measurements"></div>
      </article>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
