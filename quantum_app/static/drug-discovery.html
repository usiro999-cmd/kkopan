<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum AI Drug Discovery Twin Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">MULTIVERSE TWIN RESEARCH SIMULATION</p>
      <h1>Quantum AI Drug Discovery Twin Lab</h1>
      <p>2つの仮想標的プロファイルを並列評価し、架空化合物ランキングの変化を比較します。</p>
    </header>
    <aside class="warning">
      医療用途ではありません。合成データによる教育用モデルであり、診断・治療・実際の創薬判断には使用できません。
    </aside>

    <section class="drug-twin-grid">
      <article class="panel">
        <div class="section-heading"><div><span class="step">A</span><h2>Target Profile Alpha</h2></div></div>
        <div id="left-controls" class="profile-controls"></div>
        <label>安全性の重み
          <input id="left-safety" type="range" min="0" max="1" step="0.05" value="0.35">
          <output>0.35</output>
        </label>
      </article>
      <article class="panel">
        <div class="section-heading"><div><span class="step">B</span><h2>Target Profile Beta</h2></div></div>
        <div id="right-controls" class="profile-controls"></div>
        <label>安全性の重み
          <input id="right-safety" type="range" min="0" max="1" step="0.05" value="0.60">
          <output>0.60</output>
        </label>
      </article>
    </section>

    <button id="screen" class="primary twin-run">ツイン・スクリーニング実行</button>

    <section class="drug-twin-grid">
      <article class="panel">
        <div class="section-heading"><div><span class="step">A</span><h2>Alpha Ranking</h2></div></div>
        <div id="left-ranking"></div>
      </article>
      <article class="panel">
        <div class="section-heading"><div><span class="step">B</span><h2>Beta Ranking</h2></div></div>
        <div id="right-ranking"></div>
      </article>
    </section>

    <section class="panel twin-summary">
      <div><strong id="correlation">—</strong><span>順位相関</span></div>
      <div><strong id="same-leader">—</strong><span>首位候補の一致</span></div>
      <div id="rank-shifts" class="rank-shifts"></div>
      <p id="error" role="alert"></p>
    </section>
  </main>
  <script src="drug-discovery.js"></script>
</body>
</html>
