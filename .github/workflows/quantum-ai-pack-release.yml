name: Release Quantum AI Pack

on:
  push:
    tags:
      - "quantum-ai-v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable AI pack
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: quantum_os/ai_pack
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kkopan/quantum-ai-pack:${{ github.ref_name }}

      - name: Create signed AI pack manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SIGNING_KEY: ${{ secrets.QUANTUM_OS_UPDATE_SIGNING_KEY }}
        run: |
          python -m pip install --disable-pip-version-check pynacl==1.6.2
          python - <<'PY'
          import base64
          import json
          import os
          import re
          from datetime import UTC, datetime
          from pathlib import Path
          from nacl.signing import SigningKey

          version = os.environ["GITHUB_REF_NAME"].removeprefix("quantum-ai-v")
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None:
              raise SystemExit("AI pack tag must contain a semantic version")
          payload = {
              "schema_version": 1,
              "release": os.environ["GITHUB_REF_NAME"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "package_id": "multiverse-explainable-ai",
              "version": version,
              "image": f"ghcr.io/{os.environ['GITHUB_REPOSITORY_OWNER']}/kkopan/quantum-ai-pack",
              "digest": os.environ["IMAGE_DIGEST"],
              "published_at": datetime.now(UTC).isoformat(),
          }
          manifest = json.dumps(
              payload, separators=(",", ":"), sort_keys=True
          ).encode()
          key = SigningKey(base64.b64decode(os.environ["SIGNING_KEY"]))
          Path("quantum-ai-pack.json").write_bytes(manifest)
          Path("quantum-ai-pack.sig").write_bytes(
              base64.b64encode(key.sign(manifest).signature)
          )
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            quantum-ai-pack.json quantum-ai-pack.sig \
            --generate-notes --verify-tag
